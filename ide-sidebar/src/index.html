<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Centurion</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Michroma&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: var(--vscode-sideBar-background, #16171a);
  --panel: var(--vscode-editor-background, #1c1d21);
  --raise: #24262b;
  --line: var(--vscode-panel-border, #2c2e34);
  --text: var(--vscode-foreground, #d4d6db);
  --dim: #8a8e98;
  --faint: #5d616b;
  --accent: #ffc2e8;
  --accent-h: #ffd3ef;
  --on-accent: #2a1020;
  --ok: #4fb286;
  --warn: #d9a441;
  --bad: #e0675f;
  --run: #6aa4e8;
  --font: var(--vscode-font-family, -apple-system, "Segoe UI", sans-serif);
  --mono: var(--vscode-editor-font-family, Consolas, "Courier New", monospace);
  --brand: "Michroma", "Segoe UI", sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font: 13px/1.5 var(--font); display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
button:focus-visible, textarea:focus-visible, .hist-item:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-thumb { background: #34363d; border-radius: 4px; }

header { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--brand); font-size: 12px; letter-spacing: .14em; color: #fff; display: flex; align-items: center; gap: 8px; }
.brand i { width: 8px; height: 8px; background: var(--accent); transform: rotate(45deg); }
.tools { display: flex; gap: 2px; }
.icon-btn { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 5px; color: var(--dim); }
.icon-btn:hover { background: var(--raise); color: var(--text); }

#tabs { display: flex; gap: 4px; padding: 8px 12px 0; border-bottom: 1px solid var(--line); }
.tab { padding: 6px 10px 8px; color: var(--dim); border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; gap: 6px; align-items: center; }
.tab:hover { color: var(--text); }
.tab.on { color: #fff; border-color: var(--accent); }
.badge { background: var(--accent); color: var(--on-accent); font-size: 10px; font-weight: 700; border-radius: 8px; padding: 0 6px; line-height: 15px; }
.badge[hidden] { display: none; }

#history { display: none; max-height: 170px; overflow-y: auto; border-bottom: 1px solid var(--line); background: var(--panel); padding: 4px 0; }
#history.open { display: block; }
.hist-item { display: flex; justify-content: space-between; gap: 8px; padding: 6px 14px; cursor: pointer; color: var(--dim); }
.hist-item:hover { background: var(--raise); color: var(--text); }
.hist-item.on { color: #fff; }
.hist-item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist-item span:last-child { font-size: 11px; color: var(--faint); flex-shrink: 0; }
.hist-empty { padding: 8px 14px; color: var(--faint); }

main { flex: 1; min-height: 0; position: relative; }
.view { position: absolute; inset: 0; overflow-y: auto; padding: 14px 12px; display: none; flex-direction: column; gap: 12px; scroll-behavior: smooth; }
.view.on { display: flex; }

.empty { margin: auto; text-align: center; color: var(--dim); max-width: 230px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.empty .mark { width: 42px; height: 42px; border: 1px solid var(--line); border-radius: 10px; display: grid; place-items: center; color: var(--accent); }
.empty .mark svg { width: 20px; height: 20px; }
.empty p { font-size: 12px; }

.msg { display: flex; flex-direction: column; gap: 4px; }
.msg.user { align-items: flex-end; }
.bubble { max-width: 94%; padding: 8px 11px; border-radius: 8px; word-wrap: break-word; overflow-wrap: anywhere; }
.msg.user .bubble { background: var(--raise); border: 1px solid var(--line); white-space: pre-wrap; }
.msg.assistant .bubble { padding: 0 2px; max-width: 100%; }
.bubble p + p { margin-top: 8px; }
.bubble code { font-family: var(--mono); font-size: 12px; background: var(--raise); padding: 1px 5px; border-radius: 4px; }
.bubble pre { background: #101113; border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; overflow-x: auto; margin: 8px 0; }
.bubble pre code { background: none; padding: 0; }
.files { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; max-width: 160px; }
.chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { color: var(--faint); line-height: 1; }
.chip button:hover { color: var(--bad); }
.note { align-self: flex-start; display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--dim); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; }
.note button { color: var(--accent); }
.note button:hover { text-decoration: underline; }

.think { display: flex; gap: 8px; align-items: center; color: var(--dim); font-size: 12px; }
.dots { display: flex; gap: 3px; }
.dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: .35; animation: pulse 1.1s infinite; }
.dots i:nth-child(2) { animation-delay: .18s; } .dots i:nth-child(3) { animation-delay: .36s; }
@keyframes pulse { 50% { opacity: 1; } }

.bar { display: flex; justify-content: space-between; align-items: center; color: var(--dim); font-size: 12px; }
.bar button { color: var(--accent); }
.bar button:hover { text-decoration: underline; }
.bar button:disabled { color: var(--faint); text-decoration: none; cursor: default; }
.card { border: 1px solid var(--line); border-radius: 8px; background: var(--panel); overflow: hidden; }
.card.pending { border-color: rgba(255,194,232,.35); }
.card-h { display: flex; gap: 8px; align-items: center; padding: 9px 10px; }
.kind { width: 24px; height: 24px; border-radius: 5px; background: var(--raise); display: grid; place-items: center; color: var(--dim); }
.card-t { flex: 1; min-width: 0; }
.card-t strong { display: block; font-weight: 600; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-t small { color: var(--dim); font-size: 11px; font-family: var(--mono); }
.status { font-size: 11px; display: flex; align-items: center; gap: 5px; white-space: nowrap; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-pending { color: var(--warn); } .s-running, .s-verifying { color: var(--run); }
.s-done { color: var(--ok); } .s-failed, .s-rejected { color: var(--bad); }
.s-running::before, .s-verifying::before { animation: pulse 1s infinite; }
.card-b { padding: 0 10px 10px; color: var(--dim); font-size: 12px; }
.diff { font-family: var(--mono); font-size: 11.5px; background: #101113; border: 1px solid var(--line); border-radius: 6px; margin-top: 8px; overflow-x: auto; padding: 6px 0; }
.diff div { padding: 0 10px; white-space: pre; }
.diff .a { background: rgba(79,178,134,.12); color: #8fd6b4; } .diff .r { background: rgba(224,103,95,.12); color: #eb9b95; }
.result { margin-top: 8px; padding: 7px 9px; border-radius: 6px; background: var(--raise); font-size: 12px; color: var(--text); }
.result.fail { border-left: 2px solid var(--bad); } .result.pass { border-left: 2px solid var(--ok); }
.btns { display: flex; gap: 6px; padding: 0 10px 10px; }
.btn { flex: 1; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line); }
.btn:hover { background: var(--raise); }
.btn.go { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.btn.go:hover { background: var(--accent-h); }

#composer { padding: 10px 12px 6px; }
#box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px 6px; }
#box:focus-within { border-color: var(--accent); }
#attached { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
#attached:empty { display: none; }
#input { width: 100%; background: none; border: 0; outline: 0; resize: none; color: var(--text); font: inherit; max-height: 140px; padding: 2px 4px; }
#input::placeholder { color: var(--faint); }
.row { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
.model { font-size: 11px; color: var(--faint); padding: 0 4px; }
#send { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; }
#send:hover:not(:disabled) { background: var(--accent-h); }
#send:disabled { background: var(--raise); color: var(--faint); cursor: default; }
footer { text-align: center; padding: 4px 0 9px; font-family: var(--brand); font-size: 8px; letter-spacing: .12em; color: var(--faint); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header>
  <div class="brand"><i></i>CENTURION</div>
  <div class="tools">
    <button class="icon-btn" id="btn-hist" title="History" aria-label="History"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
    <button class="icon-btn" id="btn-new" title="New chat" aria-label="New chat"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
</header>

<div id="tabs" role="tablist">
  <button class="tab on" data-tab="chat" role="tab">Chat</button>
  <button class="tab" data-tab="actions" role="tab">Actions <span class="badge" id="badge" hidden>0</span></button>
</div>

<div id="history"></div>

<main>
  <section class="view on" id="v-chat"></section>
  <section class="view" id="v-actions"></section>
</main>

<div id="composer">
  <div id="box">
    <div id="attached"></div>
    <textarea id="input" rows="1" placeholder="Describe what Centurion should do"></textarea>
    <div class="row">
      <div style="display:flex;align-items:center;gap:2px">
        <button class="icon-btn" id="btn-attach" title="Attach files" aria-label="Attach files"><svg viewBox="0 0 24 24"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.4-8.4"/></svg></button>
        <span class="model">Centurion engine</span>
      </div>
      <button id="send" title="Send" aria-label="Send" disabled><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
  <input type="file" id="file" multiple hidden />
</div>
<footer>POWERED BY APPIEY</footer>

<script>
/* Pure UI layer. No logic lives here: the Centurion engine decides everything.
   Sidebar sends: prompt, approve, reject.
   Sidebar renders: thinking, message, action, action_status, error, backend_result, decision_result. */
(() => {
  const $ = s => document.querySelector(s);
  const ICONS = {
    edit: '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
    run: '<svg viewBox="0 0 24 24"><path d="M4 17l6-5-6-5M12 19h8"/></svg>',
    file: '<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4"/></svg>',
    x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
    logo: '<svg viewBox="0 0 24 24"><path d="M12 3l8 4v6c0 4-3.5 7-8 8-4.5-1-8-4-8-8V7z"/><path d="M9 12l2 2 4-4"/></svg>'
  };

  let sessions = [], cur = null, busy = false, files = [];
  try { sessions = JSON.parse(localStorage.getItem("centurion_sessions") || "[]"); } catch (e) {}

  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const md = t => {
    const parts = esc(t).split(/```(?:\w+)?\n?/);
    return parts.map((p, i) => i % 2 ? `<pre><code>${p.replace(/\n$/, "")}</code></pre>`
      : p.trim().split(/\n{2,}/).map(x => `<p>${x.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\n/g, "<br>")}</p>`).join("")).join("");
  };
  const uid = () => Math.random().toString(36).slice(2, 9);
  const ago = id => { const m = Math.round((Date.now() - id) / 60000); return m < 1 ? "now" : m < 60 ? m + "m" : m < 1440 ? Math.round(m / 60) + "h" : Math.round(m / 1440) + "d"; };
  const save = () => { try { localStorage.setItem("centurion_sessions", JSON.stringify(sessions.slice(0, 20))); } catch (e) {} };
  const emit = (type, payload) => {
    if (typeof vscode !== "undefined") vscode.postMessage({ source: "centurion-sidebar", type, payload });
    else if (parent !== window) parent.postMessage({ source: "centurion-sidebar", type, payload }, "*");
  };

  /* ---------- sessions ---------- */
  function newSession() {
    cur = { id: Date.now(), title: "", messages: [], actions: [] };
    renderAll(); showTab("chat"); $("#history").classList.remove("open");
  }
  function loadSession(id) { cur = sessions.find(s => s.id === id); renderAll(); $("#history").classList.remove("open"); }
  function commit() { if (!sessions.includes(cur)) sessions.unshift(cur); save(); renderHistory(); }

  /* ---------- render ---------- */
  function renderHistory() {
    const h = $("#history");
    h.innerHTML = sessions.length ? "" : '<div class="hist-empty">No conversations yet</div>';
    sessions.forEach(s => {
      const el = document.createElement("div");
      el.className = "hist-item" + (cur && cur.id === s.id ? " on" : ""); el.tabIndex = 0;
      el.innerHTML = `<span>${esc(s.title || "New chat")}</span><span>${ago(s.id)}</span>`;
      el.onclick = () => loadSession(s.id);
      el.onkeydown = e => e.key === "Enter" && loadSession(s.id);
      h.appendChild(el);
    });
  }
  function msgEl(m) {
    const w = document.createElement("div");
    w.className = "msg " + m.role;
    if (m.kind === "note") {
      w.innerHTML = `<div class="note">${esc(m.content)} <button data-go>Review</button></div>`;
      w.querySelector("[data-go]").onclick = () => showTab("actions");
      return w;
    }
    if (m.files && m.files.length) w.innerHTML = `<div class="files">${m.files.map(f => `<span class="chip">${ICONS.file}<span>${esc(f)}</span></span>`).join("")}</div>`;
    const b = document.createElement("div");
    b.className = "bubble"; b.innerHTML = m.role === "user" ? esc(m.content) : md(m.content);
    w.appendChild(b); return w;
  }
  function renderChat() {
    const v = $("#v-chat"); v.innerHTML = "";
    if (!cur.messages.length) {
      v.innerHTML = `<div class="empty"><div class="mark">${ICONS.logo}</div><p>Describe a task. Centurion proposes actions, you approve, it verifies.</p></div>`;
      return;
    }
    cur.messages.forEach(m => v.appendChild(msgEl(m)));
    v.scrollTop = v.scrollHeight;
  }
  function actionEl(a) {
    const c = document.createElement("div");
    c.className = "card " + a.status;
    const diff = a.diff ? `<div class="diff">${a.diff.map(l => `<div class="${l[0] === "+" ? "a" : l[0] === "-" ? "r" : ""}">${esc(l)}</div>`).join("")}</div>` : "";
    const res = a.result ? `<div class="result ${a.status === "failed" ? "fail" : "pass"}">${esc(a.result)}</div>` : "";
    c.innerHTML = `<div class="card-h"><div class="kind">${ICONS[a.kind] || ICONS.edit}</div>
      <div class="card-t"><strong>${esc(a.title)}</strong><small>${esc(a.target)}</small></div>
      <span class="status s-${a.status}">${esc(a.status)}</span></div>
      <div class="card-b">${esc(a.detail)}${diff}${res}</div>
      ${a.status === "pending" ? `<div class="btns"><button class="btn" data-rej>Reject</button><button class="btn go" data-ok>Approve</button></div>` : ""}`;
    const ok = c.querySelector("[data-ok]"), rj = c.querySelector("[data-rej]");
    if (ok) ok.onclick = () => decide(a.id, "approve");
    if (rj) rj.onclick = () => decide(a.id, "reject");
    return c;
  }
  function renderActions() {
    const v = $("#v-actions"); v.innerHTML = "";
    const pend = cur.actions.filter(a => a.status === "pending").length;
    const bd = $("#badge"); bd.textContent = pend; bd.hidden = !pend;
    if (!cur.actions.length) {
      v.innerHTML = `<div class="empty"><div class="mark">${ICONS.logo}</div><p>No actions yet. Actions proposed by Centurion appear here for your approval.</p></div>`; return;
    }
    v.insertAdjacentHTML("beforeend", `<div class="bar"><span>${pend} awaiting approval</span><button id="all" ${pend ? "" : "disabled"}>Approve all</button></div>`);
    $("#all").onclick = () => cur.actions.filter(a => a.status === "pending").forEach(a => decide(a.id, "approve"));
    cur.actions.forEach(a => v.appendChild(actionEl(a)));
  }
  function renderAll() { renderChat(); renderActions(); renderHistory(); }
  function showTab(t) {
    document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.tab === t));
    $("#v-chat").classList.toggle("on", t === "chat"); $("#v-actions").classList.toggle("on", t === "actions");
  }
  function setThinking(on) {
    const old = $("#thinking"); if (old) old.remove();
    busy = on; fit();
    if (!on) return;
    const t = document.createElement("div");
    t.id = "thinking"; t.className = "think";
    t.innerHTML = '<span class="dots"><i></i><i></i><i></i></span><span>Thinking</span>';
    $("#v-chat").appendChild(t); $("#v-chat").scrollTop = 1e9;
  }

  /* ---------- receive (single listener) ---------- */
  const normAction = a => ({
    id: a.id || uid(), kind: a.kind || "edit", status: a.status || "pending",
    title: a.title || a.label || a.action || "Action", target: a.target || "",
    detail: a.detail || a.reason || "", diff: a.diff, result: a.result
  });
  function addMessage(role, content, kind) { cur.messages.push({ role, content, kind }); renderChat(); commit(); }
  function ingest(p) {
    setThinking(false);
    if (p && Array.isArray(p.events)) return p.events.forEach(handle);
    const text = p && (p.reply || p.response || p.message || (p.error && "Error: " + p.error));
    if (text) addMessage("assistant", text);
    const acts = (p && p.actions) || [];
    acts.forEach(a => cur.actions.push(normAction(a)));
    if (acts.length) { renderActions(); commit(); addMessage("assistant", `${acts.length} action(s) need approval`, "note"); }
    if (!text && !acts.length) addMessage("assistant", "Centurion returned no displayable response.");
  }
  function handle(ev) {
    if (!ev || !ev.type) return;
    if (!cur) newSession();
    switch (ev.type) {
      case "thinking": return setThinking(!!ev.on);
      case "message": return addMessage(ev.message.role || "assistant", ev.message.content, ev.message.kind);
      case "action": cur.actions.push(normAction(ev.action)); renderActions(); return commit();
      case "action_status": {
        const a = cur.actions.find(x => x.id === ev.id); if (!a) return;
        Object.assign(a, ev.patch); renderActions(); return commit();
      }
      case "backend_result": case "decision_result": return ingest(ev.payload);
      case "error": setThinking(false); return addMessage("assistant", "Error: " + (ev.message || "Request failed"));
    }
  }
  window.Centurion = { receive: handle };
  window.addEventListener("message", e => e.data && e.data.target === "centurion-sidebar" && handle(e.data.event));

  /* ---------- user actions (forward only) ---------- */
  function send() {
    const input = $("#input"), text = input.value.trim();
    if (!text || busy) return;
    if (!cur) newSession();
    const names = files.map(f => f.name);
    cur.messages.push({ role: "user", content: text, files: names });
    if (!cur.title) cur.title = text.slice(0, 40);
    input.value = ""; files = []; renderFiles(); renderChat(); commit();
    setThinking(true);
    emit("prompt", { text, files: names });
  }
  function decide(id, type) {
    const a = cur.actions.find(x => x.id === id); if (!a || a.status !== "pending") return;
    a.status = type === "approve" ? "running" : "rejected";
    renderActions(); commit();
    emit(type, { id });
  }

  /* ---------- composer ---------- */
  const input = $("#input");
  function fit() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 140) + "px"; $("#send").disabled = busy || !input.value.trim(); }
  function renderFiles() {
    const el = $("#attached"); el.innerHTML = "";
    files.forEach((f, i) => {
      const c = document.createElement("span"); c.className = "chip";
      c.innerHTML = `${ICONS.file}<span>${esc(f.name)}</span><button aria-label="Remove">${ICONS.x.replace("<svg", '<svg style="width:11px;height:11px"')}</button>`;
      c.querySelector("button").onclick = () => { files.splice(i, 1); renderFiles(); };
      el.appendChild(c);
    });
  }
  input.addEventListener("input", fit);
  input.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  $("#send").onclick = send;
  $("#btn-attach").onclick = () => $("#file").click();
  $("#file").onchange = e => { files.push(...e.target.files); e.target.value = ""; renderFiles(); };
  $("#btn-new").onclick = newSession;
  $("#btn-hist").onclick = () => $("#history").classList.toggle("open");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => showTab(b.dataset.tab));

  newSession();
})();
</script>
</body>
</html>
